name: Restore Level 16 source content
on:
  push:
    paths:
      - '.github/workflows/restore-level16-source.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact WordPress lesson data
        shell: bash
        run: |
          cat > /tmp/l16.b64 <<'EOF'

EOF
          base64 -d /tmp/l16.b64 | gzip -d > courses/advanced-option-level-16-short-strangle/course-data.json
          python -m json.tool courses/advanced-option-level-16-short-strangle/course-data.json >/dev/null
      - name: Commit restored data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/advanced-option-level-16-short-strangle/course-data.json
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Level 16 exact WordPress lesson content'
          git push
